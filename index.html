    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fa;
            --text: #2c3e50;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            padding: 20px 0;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }
        .header h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 2rem;
        }
        .topic-selector {
            margin-bottom: 20px;
            width: 90%;
            max-width: 500px;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            font-size: 1rem;
            color: var(--text);
            background-color: white;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%234a90e2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right .7em top 50%;
            background-size: .65em auto;
        }
        .flashcard-container {
            perspective: 1000px;
            width: 90%;
            max-width: 500px;
            height: 320px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .flashcard.is-flipped {
            transform: rotateX(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-front {
            background: var(--card-bg);
            border: 2px solid #e1e8ed;
        }
        .card-back {
            transform: rotateX(180deg);
            background: linear-gradient(135deg, #4a90e2 0%, #2980b9 100%);
            color: white;
            border: none;
        }
        .hanzi {
            font-size: 5.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .pinyin {
            font-size: 2rem;
            color: #7f8c8d;
            font-weight: 500;
        }
        .meaning {
            font-size: 2.5rem;
            font-weight: 500;
            line-height: 1.3;
        }
        .controls {
            margin-top: 2.5rem;
            display: flex;
            gap: 12px;
            align-items: center;
            width: 90%;
            max-width: 500px;
            justify-content: space-between;
        }
        button {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        button:hover {
            background: var(--primary);
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-shuffle {
            flex: 0.8;
            background: #f8f9fa;
        }
        .progress-container {
            margin-top: 2rem;
            width: 90%;
            max-width: 500px;
        }
        .progress-text {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        .progress-bar {
            height: 8px;
            background: #e1e8ed;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        @media (max-width: 600px) {
            .flashcard-container { height: 280px; }
            .hanzi { font-size: 4.5rem; }
            .pinyin { font-size: 1.6rem; }
            .meaning { font-size: 2rem; }
            button { padding: 10px 15px; font-size: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .controls { gap: 8px; }
        }
    </style>
</head>

            </div>
            <div class="card-face card-back">

        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()"><i class="fas fa-arrow-left"></i> Trước</button>
        <button class="btn-shuffle" onclick="shuffleCards()"><i class="fas fa-random"></i></button>
        <button onclick="nextCard()">Sau <i class="fas fa-arrow-right"></i></button>
    </div>

        let currentVocabList = [];
        let currentIndex = 0;

        const topicSelect = document.getElementById('topicSelect');
        const card = document.getElementById('card');
        const cardContainer = document.getElementById('cardContainer');

        for (const topic in vocabTopics) {
            const option = document.createElement('option');
            option.value = topic;
            option.textContent = `📍 ${topic} (${vocabTopics[topic].length} từ)`;
            topicSelect.appendChild(option);
            
            allVocab = allVocab.concat(vocabTopics[topic]);
        }
        
        currentVocabList = [...allVocab];

        cardContainer.addEventListener('click', () => {
            card.classList.toggle('is-flipped');
        });

        function changeTopic() {
            const selectedTopic = topicSelect.value;
            if (selectedTopic === 'all') {
                currentVocabList = [...allVocab];
            } else {
                currentVocabList = [...vocabTopics[selectedTopic]];
            }
            currentIndex = 0; 
            updateCard();
        }

        function updateCard() {
            if(currentVocabList.length === 0) return;
            
            const word = currentVocabList[currentIndex];
            document.getElementById('hanzi').textContent = word.hanzi;
            document.getElementById('pinyin').textContent = word.pinyin;
            document.getElementById('meaning').textContent = word.meaning;
            
            card.classList.remove('is-flipped');

            const currentNum = currentIndex + 1;
            const total = currentVocabList.length;
            document.getElementById('progressText').textContent = currentNum + " / " + total;
            document.getElementById('progressFill').style.width = ((currentNum / total) * 100) + "%";
        }

        function nextCard() {
            if (currentIndex < currentVocabList.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            for (let i = currentVocabList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentVocabList[i], currentVocabList[j]] = [currentVocabList[j], currentVocabList[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                card.classList.toggle('is-flipped');
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        updateCard();
    </script>
</body>
</html>
