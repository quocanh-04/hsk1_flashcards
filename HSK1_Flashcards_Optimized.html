<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSK 1 Flashcards</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fa;
            --text: #2c3e50;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Ngăn highlight màu xanh khi tap trên iOS/Android */
            -webkit-tap-highlight-color: transparent; 
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 1rem;
        }
        .header h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 2rem;
        }
        .header p {
            margin: 0;
            color: #7f8c8d;
        }
        .flashcard-container {
            perspective: 1000px;
            width: 90%;
            max-width: 500px;
            height: 320px;
            cursor: pointer;
            /* Ngăn chặn việc lỡ bôi đen text khi chạm nhanh trên điện thoại */
            user-select: none; 
            -webkit-user-select: none;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .flashcard.is-flipped {
            transform: rotateX(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-front {
            background: var(--card-bg);
            border: 2px solid #e1e8ed;
        }
        .card-back {
            transform: rotateX(180deg);
            background: linear-gradient(135deg, #4a90e2 0%, #2980b9 100%);
            color: white;
            border: none;
        }
        .hanzi {
            font-size: 5.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .pinyin {
            font-size: 2rem;
            color: #7f8c8d;
            font-weight: 500;
        }
        .meaning {
            font-size: 2.5rem;
            font-weight: 500;
            line-height: 1.3;
        }
        .controls {
            margin-top: 2.5rem;
            display: flex;
            gap: 12px;
            align-items: center;
            width: 90%;
            max-width: 500px;
            justify-content: space-between;
        }
        button {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            /* Ngăn bôi đen khi bấm nút */
            user-select: none; 
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        button:hover {
            background: var(--primary);
            color: white;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-shuffle {
            flex: 0.8;
            background: #f8f9fa;
        }
        .progress-container {
            margin-top: 2rem;
            width: 90%;
            max-width: 500px;
        }
        .progress-text {
            text-align: center;
            margin-bottom: 8px;
            font-weight: 600;
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        .progress-bar {
            height: 8px;
            background: #e1e8ed;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .instructions {
            margin-top: 2rem;
            color: #95a5a6;
            font-size: 0.95rem;
            text-align: center;
            padding: 0 1rem;
        }
        
        /* Tối ưu riêng cho điện thoại */
        @media (max-width: 600px) {
            .flashcard-container { height: 280px; }
            .hanzi { font-size: 4.5rem; }
            .pinyin { font-size: 1.6rem; }
            .meaning { font-size: 2rem; }
            button { padding: 10px 15px; font-size: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .controls { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Từ vựng HSK 1</h1>
        <p>Phiên bản Web Tĩnh tối ưu cho GitHub Pages</p>
    </div>

    <div class="flashcard-container" id="cardContainer">
        <div class="flashcard" id="card">
            <div class="card-face card-front">
                <div class="hanzi" id="hanzi"></div>
                <div class="pinyin" id="pinyin"></div>
            </div>
            <div class="card-face card-back">
                <div class="meaning" id="meaning"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()"><i class="fas fa-arrow-left"></i> Trước</button>
        <button class="btn-shuffle" onclick="shuffleCards()"><i class="fas fa-random"></i></button>
        <button onclick="nextCard()">Sau <i class="fas fa-arrow-right"></i></button>
    </div>

    <div class="progress-container">
        <div class="progress-text" id="progressText">1 / 100</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="instructions">
        Mẹo: Chạm vào thẻ hoặc bấm phím cách (Space) để lật.<br>Dùng mũi tên ⬅ ➡ để chuyển bài.
    </div>

        let vocab = [...rawVocab];
        let currentIndex = 0;

        const card = document.getElementById('card');
        const cardContainer = document.getElementById('cardContainer');
        
        // Xử lý lật thẻ khi click/tap
        cardContainer.addEventListener('click', () => {
            card.classList.toggle('is-flipped');
        });

        function updateCard() {
            const word = vocab[currentIndex];
            document.getElementById('hanzi').textContent = word.hanzi;
            document.getElementById('pinyin').textContent = word.pinyin;
            document.getElementById('meaning').textContent = word.meaning;
            
            // Luôn reset về mặt trước khi chuyển thẻ
            card.classList.remove('is-flipped');

            // Cập nhật thanh tiến trình
            const currentNum = currentIndex + 1;
            const total = vocab.length;
            document.getElementById('progressText').textContent = currentNum + " / " + total;
            document.getElementById('progressFill').style.width = ((currentNum / total) * 100) + "%";
        }

        function nextCard() {
            if (currentIndex < vocab.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            // Thuật toán Fisher-Yates để trộn thẻ
            for (let i = vocab.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        // Bắt sự kiện bàn phím cho máy tính
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Ngăn cuộn trang
                card.classList.toggle('is-flipped');
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        });

        // Khởi tạo thẻ đầu tiên khi load web
        updateCard();
